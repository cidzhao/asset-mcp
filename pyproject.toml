[project]
name = "asset-mcp"
version = "0.1.2"
description = "Read-only MCP server for multi-account personal asset aggregation."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "cidzhao" },
]
keywords = [
    "asset",
    "mcp",
    "net-worth",
    "portfolio",
    "personal-finance",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27.0",
    "mcp>=1.2.0",
    "PyYAML>=6.0.1",
]

[project.urls]
Homepage = "https://github.com/cidzhao/asset-mcp"
Repository = "https://github.com/cidzhao/asset-mcp"
Issues = "https://github.com/cidzhao/asset-mcp/issues"

[project.optional-dependencies]
moomoo = [
    "moomoo-api>=10.0.0",
]
longbridge = [
    "longbridge>=4.0.0",
]
dev = [
    "pandas>=2.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.1",
]

[project.scripts]
asset-mcp = "asset_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = [
    "/.claude",
    "/.codex",
    "/.DS_Store",
    "/.pytest_cache",
    "/.ruff_cache",
    "/.venv",
    "/demo",
    "/dist",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"
