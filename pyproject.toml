[project]
name = "asset-mcp"
version = "0.1.0"
description = "Read-only MCP server for multi-account personal asset aggregation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "mcp>=1.2.0",
    "PyYAML>=6.0.1",
]

[project.optional-dependencies]
moomoo = [
    "futu-api>=9.1.0",
]
longbridge = [
    "longbridge>=4.0.0",
]
dev = [
    "pandas>=2.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.1",
]

[project.scripts]
asset-mcp = "asset_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"
